<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact home — mobile prototype</title>
<!-- PROTOTYPE: three mobile-first variants of the artifact home page, switchable via ?variant=A|B|C
     Question: how should the home page work on a phone? Big touch targets, no overflow, thumb-reachable controls. -->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* ---------- OC-2 neutrals + kept accents ---------- */
  :root, [data-theme="dark"] {
    --bg: #161616; --surface: #1C1C1C; --surface-2: #232323; --border: #282828;
    --text: #EDEDED; --muted: #A0A0A0; --faint: #707070; --hover: #232323;
    --accent: #6ea8fe; --accent-soft: rgba(110,168,254,.16);
    --proto-bg: rgba(110,168,254,.16);  --proto-fg: #9cc4ff; --proto-bd: rgba(110,168,254,.4);
    --plan-bg:  rgba(86,200,143,.16);   --plan-fg:  #7fd6a8; --plan-bd:  rgba(86,200,143,.4);
    --site-bg:  rgba(177,140,255,.16);  --site-fg:  #c3a6ff; --site-bd:  rgba(177,140,255,.4);
    --other-bg: rgba(154,163,178,.14);  --other-fg: #aeb6c4; --other-bd: rgba(154,163,178,.35);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #F8F8F8; --surface: #FFFFFF; --surface-2: #F3F3F3; --border: #DBDBDB;
    --text: #171717; --muted: #6F6F6F; --faint: #8F8F8F; --hover: #EDEDED;
    --accent: #2563eb; --accent-soft: rgba(37,99,235,.1);
    --proto-bg: #e3efff; --proto-fg: #1d5fbf; --proto-bd: #b6d2fa;
    --plan-bg:  #e2f7ea; --plan-fg:  #1c7a41; --plan-bd:  #b6e4c8;
    --site-bg:  #f0e9ff; --site-fg:  #6b35c0; --site-bd:  #d6c2f7;
    --other-bg: #eceef2; --other-fg: #555d6a; --other-bd: #d7dbe2;
    color-scheme: light;
  }

  .type-badge {
    font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    padding: .2rem .55rem; border-radius: 999px; white-space: nowrap; border: 1px solid transparent;
  }
  .type-prototype { background: var(--proto-bg); color: var(--proto-fg); border-color: var(--proto-bd); }
  .type-plan      { background: var(--plan-bg);  color: var(--plan-fg);  border-color: var(--plan-bd); }
  .type-site      { background: var(--site-bg);  color: var(--site-fg);  border-color: var(--site-bd); }
  .type-other     { background: var(--other-bg); color: var(--other-fg); border-color: var(--other-bd); }
  .type-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .t-prototype { background: var(--proto-fg); }
  .t-plan      { background: var(--plan-fg); }
  .t-site      { background: var(--site-fg); }
  .t-other     { background: var(--other-fg); }

  .shell { min-height: 100vh; background: var(--bg); color: var(--text); padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .shell ::-webkit-scrollbar { display: none; }

  /* shared sticky header */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
  .topbar h1 { margin: 0; font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
  .topbar h1 .mark { color: var(--accent); }
  .topbar .actions { display: flex; gap: .5rem; }
  .iconbtn {
    min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 1.15rem; cursor: pointer;
  }
  .iconbtn:active { transform: scale(.96); }

  .search { margin-top: .6rem; position: relative; }
  .search input {
    width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 0 .9rem 0 2.4rem;
    font-size: 16px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search input::placeholder { color: var(--faint); }
  .search .glyph { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }

  /* scrollable pill row */
  .pills {
    display: flex; gap: .45rem; margin-top: .6rem; overflow-x: auto; padding-bottom: .2rem;
    scrollbar-width: none;
  }
  .pill {
    flex: none; min-height: 40px; padding: 0 1rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: .9rem;
    display: inline-flex; align-items: center; gap: .4rem;
  }
  .pill:active { transform: scale(.97); }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .pill .cnt { font-size: .72rem; opacity: .75; }

  /* ============ Variant A: stacked cards ============ */
  .va .cards { display: grid; gap: .7rem; padding: .9rem; grid-template-columns: 1fr; }
  .va .card {
    display: block; text-decoration: none; color: inherit; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: .85rem .95rem;
    min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; gap: .5rem;
  }
  .va .card:active { background: var(--hover); }
  .va .card .row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .va .card .ttl { font-weight: 650; font-size: 1.02rem; line-height: 1.3; }
  .va .card .dsc { color: var(--muted); font-size: .86rem; }
  .va .card .when { color: var(--faint); font-size: .74rem; }
  @media (min-width: 640px) { .va .cards { grid-template-columns: repeat(2, 1fr); } }

  /* ============ Variant B: app list + bottom tab bar ============ */
  .vb .list { padding: .3rem .9rem .9rem; }
  .vb .listrow {
    display: flex; align-items: center; gap: .8rem; min-height: 66px; padding: .6rem .4rem;
    border-bottom: 1px solid var(--border); text-decoration: none; color: inherit;
  }
  .vb .listrow:active { background: var(--hover); }
  .vb .listrow .body { flex: 1; min-width: 0; }
  .vb .listrow .ttl { font-weight: 600; font-size: .96rem; }
  .vb .listrow .dsc { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vb .listrow .when { color: var(--faint); font-size: .72rem; flex: none; }
  .vb .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--surface) 96%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .vb .tab {
    min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .15rem; border: none; background: none; color: var(--faint); font-size: .62rem;
    cursor: pointer; text-transform: uppercase; letter-spacing: .04em;
  }
  .vb .tab .ic { font-size: 1.15rem; line-height: 1; }
  .vb .tab.on { color: var(--accent); font-weight: 700; }
  .vb .tab.on .ic { color: var(--accent); }

  /* ============ Variant C: day feed ============ */
  .vc .feed { padding: .3rem .9rem .9rem; }
  .vc .dayhead {
    display: flex; align-items: center; gap: .8rem; margin: 1.1rem 0 .2rem;
    font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent);
  }
  .vc .dayhead .rule { flex: 1; height: 1px; background: var(--border); }
  .vc .entry {
    display: flex; flex-direction: column; gap: .35rem; min-height: 86px; padding: .8rem .2rem;
    border-bottom: 1px solid var(--border); text-decoration: none; color: inherit;
  }
  .vc .entry:active { background: var(--hover); }
  .vc .entry .e-top { display: flex; align-items: center; gap: .55rem; }
  .vc .entry .ttl { font-size: 1.05rem; font-weight: 650; line-height: 1.3; }
  .vc .entry .dsc { color: var(--muted); font-size: .85rem; }
  .vc .entry .e-meta { color: var(--faint); font-size: .72rem; display: flex; gap: .6rem; align-items: center; }
  @media (min-width: 640px) { .vc .feed { max-width: 640px; margin: 0 auto; } }

  /* ---------- floating switcher (mobile-sized) ---------- */
  #switcher {
    position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: .55rem; z-index: 60;
    background: #13161d; color: #eef1f6; border: 1px solid #333a46;
    border-radius: 999px; padding: .3rem .4rem; box-shadow: 0 8px 28px rgba(0,0,0,.5);
    font-size: .78rem; max-width: calc(100vw - 24px);
  }
  #switcher .btn {
    min-width: 34px; min-height: 34px; border-radius: 50%; border: 1px solid #3a4150; background: #1b202a;
    color: #c9d0dc; font-size: .95rem; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  #switcher .btn:active { background: #2a313e; }
  #switcher .label { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #switcher .label small { color: #8b93a1; font-weight: 400; }
  #switcher .theme {
    min-width: 34px; min-height: 34px; border-radius: 50%; border: 1px solid #3a4150; background: #1b202a;
    color: #c9d0dc; cursor: pointer; display: grid; place-items: center; padding: 0; font-size: .95rem;
  }
  #switcher .proto-note {
    position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
    background: #13161d; border: 1px solid #333a46; color: #ffb4b0; font-size: .6rem;
    letter-spacing: .08em; text-transform: uppercase; padding: .12rem .5rem; border-radius: 6px; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher" role="group" aria-label="Prototype variant switcher">
  <span class="proto-note">UI prototype</span>
  <button class="btn" id="prev" aria-label="Previous variant">&#8249;</button>
  <span class="label" id="label"></span>
  <button class="btn" id="next" aria-label="Next variant">&#8250;</button>
  <button class="theme" id="themeBtn" aria-label="Toggle light / dark">&#9789;</button>
</div>
<script>
const ARTIFACTS = [
  { d:"Today",     date:"Aug 5", time:"14:22", type:"prototype", title:"Artifact Home — Mobile", desc:"Three mobile-first home-page variants" },
  { d:"Today",     date:"Aug 5", time:"11:40", type:"prototype", title:"Smoke Test", desc:"Verify the publish pipeline end to end" },
  { d:"Today",     date:"Aug 5", time:"09:15", type:"plan",      title:"Grant Proposal Draft", desc:"Sponsorship ask for the summer research sprint" },
  { d:"Yesterday", date:"Aug 4", time:"18:30", type:"site",      title:"Landing Page Refresh", desc:"New hero, pricing section, and a compressed footer" },
  { d:"Yesterday", date:"Aug 4", time:"15:10", type:"plan",      title:"Triage Workflow Notes", desc:"State machine for triage roles, captured last week" },
  { d:"Yesterday", date:"Aug 4", time:"12:00", type:"prototype", title:"Order State Simulator", desc:"Terminal app pushing the state model through edge cases" },
  { d:"Tuesday",   date:"Aug 3", time:"20:45", type:"site",      title:"Portfolio v2", desc:"Full static rebuild with 11ty, now with a dark mode" },
  { d:"Tuesday",   date:"Aug 3", time:"16:20", type:"plan",      title:"Architecture Overview", desc:"Two-piece design: server plus a global publish skill" },
  { d:"Tuesday",   date:"Aug 3", time:"10:05", type:"prototype", title:"Color System Experiment", desc:"Picking accent palettes for the new dashboard" },
  { d:"Monday",    date:"Aug 2", time:"22:10", type:"other",     title:"Weekend Reading List", desc:"Curated links on distributed systems" },
];
const DAYDATE = { "Today":"2026-08-05", "Yesterday":"2026-08-04", "Tuesday":"2026-08-03", "Monday":"2026-08-02" };
const VARIANTS = [
  { key:"A", name:"Stacked cards",   render: renderA },
  { key:"B", name:"List + bottom nav", render: renderB },
  { key:"C", name:"Day feed",        render: renderC },
];
const COUNT = { prototype:0, plan:0, site:0, other:0 };
ARTIFACTS.forEach(a => COUNT[a.type]++);

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function href(a){ const slug = a.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); return "/" + (DAYDATE[a.d]||"2026-08-05") + "/" + slug + "/"; }
function groupByDay(list){ const m = new Map(); for (const a of list){ if(!m.has(a.d)) m.set(a.d, []); m.get(a.d).push(a); } return [...m.values()]; }
function pillRow(active){
  return `<div class="pills" id="pills">
    <button class="pill on" data-f="all">All <span class="cnt">${ARTIFACTS.length}</span></button>
    <button class="pill" data-f="prototype">Proto <span class="cnt">${COUNT.prototype}</span></button>
    <button class="pill" data-f="plan">Plan <span class="cnt">${COUNT.plan}</span></button>
    <button class="pill" data-f="site">Site <span class="cnt">${COUNT.site}</span></button>
    <button class="pill" data-f="other">Other <span class="cnt">${COUNT.other}</span></button>
  </div>`;
}
function header(){
  return `<div class="top"><div class="topbar">
    <h1><span class="mark">&#9670;</span> Artifacts</h1>
    <div class="actions"><button class="iconbtn" id="tbtn">&#9789;</button></div>
  </div></div>`;
}

/* ---------- Variant A: stacked cards ---------- */
function renderA(list){
  const cards = list.map(a => `
    <a class="card" href="${href(a)}">
      <div class="row"><span class="type-badge type-${esc(a.type)}">${esc(a.type)}</span><span class="when">${esc(a.time)}</span></div>
      <div><div class="ttl">${esc(a.title)}</div><div class="dsc">${esc(a.desc)}</div></div>
      <div class="when">${esc(a.d)} &middot; ${esc(a.date)}</div>
    </a>`).join("");
  return `<div class="shell va">
    ${header()}
    <div class="top" style="border-bottom:none;padding-top:0">
      <div class="search"><span class="glyph">&#128269;</span><input type="search" placeholder="Search artifacts…" id="search"></div>
      ${pillRow()}
    </div>
    <div class="cards" id="items">${cards || '<div class="card"><div class="dsc">No artifacts yet.</div></div>'}</div>
  </div>`;
}

/* ---------- Variant B: app list + bottom tabs ---------- */
function renderB(list){
  const rows = list.map(a => `
    <a class="listrow" href="${href(a)}">
      <span class="type-dot t-${esc(a.type)}"></span>
      <span class="body"><span class="ttl">${esc(a.title)}</span><div class="dsc">${esc(a.desc)}</div></span>
      <span class="when">${esc(a.time)}</span>
    </a>`).join("");
  const tabs = [["all","&#9633;","All"],["prototype","&#9678;","Proto"],["plan","&#9776;","Plan"],["site","&#9650;","Site"],["other","&#9679;","Other"]]
    .map((t,i) => `<button class="tab ${i===0?"on":""}" data-f="${t[0]}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("");
  return `<div class="shell vb">
    ${header()}
    <div class="top" style="border-bottom:none;padding-top:0">
      <div class="search"><span class="glyph">&#128269;</span><input type="search" placeholder="Search artifacts…" id="search"></div>
    </div>
    <div class="list" id="items">${rows || '<div class="listrow"><div class="dsc">No artifacts yet.</div></div>'}</div>
    <nav class="tabs" id="tabs">${tabs}</nav>
  </div>`;
}

/* ---------- Variant C: day feed ---------- */
function renderC(list){
  const feed = groupByDay(list).map(days_ => `
    <div class="dayhead">${esc(days_[0].d)}<span class="rule"></span></div>
    ${days_.map(a => `
    <a class="entry" href="${href(a)}">
      <div class="e-top"><span class="type-badge type-${esc(a.type)}">${esc(a.type)}</span><span class="e-meta">${esc(a.time)}</span></div>
      <div class="ttl">${esc(a.title)}</div>
      <div class="dsc">${esc(a.desc)}</div>
    </a>`).join("")}
  `).join("");
  return `<div class="shell vc">
    ${header()}
    <div class="top" style="border-bottom:none;padding-top:0">
      <div class="search"><span class="glyph">&#128269;</span><input type="search" placeholder="Search artifacts…" id="search"></div>
      ${pillRow()}
    </div>
    <div class="feed" id="items">${feed || '<div class="entry"><div class="dsc">No artifacts yet.</div></div>'}</div>
  </div>`;
}

/* ---------- theme + switcher logic ---------- */
const app = document.getElementById("app");
const labelEl = document.getElementById("label");
const themeBtn = document.getElementById("themeBtn");
let idx = 0;

function currentVariant(){
  const v = new URLSearchParams(location.search).get("variant");
  const i = VARIANTS.findIndex(x => x.key === (v||"").toUpperCase());
  return i >= 0 ? i : 0;
}
function currentTheme(){
  return new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";
}
function applyTheme(){
  const t = currentTheme();
  document.documentElement.dataset.theme = t;
  themeBtn.innerHTML = t === "dark" ? "&#9788;" : "&#9789;";
  const tbtn = document.getElementById("tbtn");
  if (tbtn) tbtn.innerHTML = t === "dark" ? "&#9788;" : "&#9789;";
}
function setTheme(t){
  const url = new URL(location.href);
  url.searchParams.set("theme", t);
  history.replaceState({}, "", url);
  applyTheme();
}
function apply(){
  idx = currentVariant();
  app.innerHTML = VARIANTS[idx].render(ARTIFACTS);
  labelEl.innerHTML = `<b>${VARIANTS[idx].key}</b> &mdash; ${VARIANTS[idx].name}`;
  wireVariantHooks();
}
function setVariant(i){
  idx = (i + VARIANTS.length) % VARIANTS.length;
  const url = new URL(location.href);
  url.searchParams.set("variant", VARIANTS[idx].key);
  history.replaceState({}, "", url);
  apply();
}

function wireVariantHooks(){
  applyTheme();
  const tbtn = document.getElementById("tbtn");
  if (tbtn) tbtn.addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));

  const pills = document.getElementById("pills");
  if (pills) pills.querySelectorAll("[data-f]").forEach(p => p.addEventListener("click", () => {
    pills.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === p));
    filterItems(p.dataset.f);
  }));
  const tabs = document.getElementById("tabs");
  if (tabs) tabs.querySelectorAll("[data-f]").forEach(t => t.addEventListener("click", () => {
    tabs.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === t));
    filterItems(t.dataset.f);
  }));
  const search = document.getElementById("search");
  if (search) search.addEventListener("input", () => {
    const q = search.value.toLowerCase();
    document.querySelectorAll("#items > .card, #items > .listrow, #items > .entry").forEach(r => {
      r.style.display = r.textContent.toLowerCase().indexOf(q) !== -1 ? "" : "none";
    });
    hideEmptyDays();
  });
  function filterItems(f){
    document.querySelectorAll("#items > .card, #items > .listrow, #items > .entry").forEach(r => {
      const badge = r.querySelector(".type-badge, .type-dot");
      const isType = badge && badge.classList.contains("t-" + f);
      const isBadge = badge && badge.classList.contains("type-" + f);
      r.style.display = (f === "all" || isType || isBadge) ? "" : "none";
    });
    hideEmptyDays();
  }
  function hideEmptyDays(){
    document.querySelectorAll(".dayhead").forEach(d => {
      let next = d.nextElementSibling, any = false;
      while (next && next.classList && !next.classList.contains("dayhead")) {
        if (next.style.display !== "none") any = true;
        next = next.nextElementSibling;
      }
      d.style.display = any ? "" : "none";
    });
  }
}

document.getElementById("prev").addEventListener("click", () => setVariant(idx - 1));
document.getElementById("next").addEventListener("click", () => setVariant(idx + 1));
themeBtn.addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") setVariant(idx - 1);
  if (e.key === "ArrowRight") setVariant(idx + 1);
  if (e.key === "t" || e.key === "T") setTheme(currentTheme() === "dark" ? "light" : "dark");
});
applyTheme();
apply();
</script>
</body>
</html>
